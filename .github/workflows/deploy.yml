name: "Deploy Core Infrastructure (Cognito · SSM)"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, sit, stage, prod]

env:
  AWS_REGION:   eu-north-1
  PROJECT_NAME: api-portal
  ENVIRONMENT:  ${{ github.event.inputs.environment || 'dev' }}
  TF_VERSION:   '~1.7'

jobs:
  deploy:
    name: "[${{ github.event.inputs.environment || 'dev' }}] Core — Cognito · SSM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: api-portal-core-${{ env.ENVIRONMENT }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infrastructure
        run: |
          terraform init \
            -backend-config="key=${{ env.PROJECT_NAME }}/core/${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure
        run: |
          terraform plan \
            -var-file="envs/${{ env.ENVIRONMENT }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        working-directory: infrastructure
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "  ✅ CORE DEPLOYED  |  env=${{ env.ENVIRONMENT }}"
          echo "══════════════════════════════════════════════"
          terraform output cognito_user_pool_id
          terraform output cognito_client_id
          terraform output ssm_paths
          echo "══════════════════════════════════════════════"
          echo "  ▶ Next: trigger api-portal-backend deploy"
          echo "══════════════════════════════════════════════"
